name: flutter_ecom
description: A Flutter e-commerce module for embedding in native Android/iOS apps.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # 状态管理
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # 依赖注入
  get_it: ^7.7.0

  # 网络请求
  dio: ^5.4.0

  # 本地存储
  shared_preferences: ^2.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 路由
  go_router: ^14.0.0

  # 图片
  cached_network_image: ^3.3.1

  # UI 组件
  easy_refresh: ^3.4.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0

  # 工具
  logger: ^2.2.0
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  # json_serializable: ^6.7.1  # 项目使用手动 fromJson，如需代码生成可启用
  # 注：hive_generator 和 bloc_test 在当前 Flutter 版本下有依赖冲突，
  # 项目中 Hive TypeAdapter 已手动实现，不影响运行。
  # 如需生成代码，可单独运行: flutter pub add hive_generator --dev
  # bloc_test: ^9.1.7
  # mockito: ^5.4.4

# 面试讲解点（踩坑经验）：
# Flutter 3.47 移除了插件项目里的 flutter.compileSdkVersion 扩展属性，
# 但 shared_preferences_android 2.4.28 / sqflite_android 2.4.4（当时最新版）
# 还在使用该 API，导致 Android 宿主源码依赖编译失败（Unresolved reference）。
# 解决方式：把受影响的插件 vendor 到 third_party/ 目录，
# 修补其 build.gradle 后通过 dependency_overrides 指向本地副本。
# 上游插件发布兼容版本后，删除这段 override 和 third_party 目录即可。
dependency_overrides:
  shared_preferences_android:
    path: third_party/shared_preferences_android
  sqflite_android:
    path: third_party/sqflite_android

flutter:
  uses-material-design: true

  assets:
    - mock/assets/
    - assets/images/

  # This section identifies your Flutter project as a module meant for
  # embedding in a native host app.
  module:
    androidX: true
    androidPackage: com.example.flutter_ecom
    iosBundleIdentifier: com.example.flutterEcom
