group 'com.tekartik.sqflite'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach {
                options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation" << "-Xlint:cast" <<
                        "-Xlint:classfile" << "-Xlint:divzero" << "-Xlint:empty" << "-Xlint:fallthrough" <<
                        "-Xlint:finally" << "-Xlint:overrides" << "-Xlint:path" << "-Xlint:processing" <<
                        "-Xlint:rawtypes" << "-Xlint:try"
            }
        }
    }
}

apply plugin: 'com.android.library'

android {
    // Namespace
    namespace 'com.tekartik.sqflite'

    // PATCHED for Flutter 3.47: `flutter.compileSdkVersion` was removed from the
    // plugin-facing flutter extension. Hardcode to 36 (= FlutterExtension.compileSdkVersion
    // in Flutter 3.47). Remove this override once upstream releases a compatible version.
    compileSdk = 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 19
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
